name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_QPA_PLATFORM: offscreen
  CUDA_HOME: /usr/local/cuda

jobs:
  test-and-build:
    name: Build, Test & Package
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install system dependencies & headless Qt/XCB libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            ccache \
            g++ \
            xvfb \
            libgl1 \
            libegl1 \
            libgl1-mesa-dri \
            libglib2.0-0 \
            libfontconfig1 \
            libfreetype6 \
            libdbus-1-3 \
            libxkbcommon-x11-0 \
            libxkbcommon0 \
            libx11-xcb1 \
            libxrender1 \
            libxext6 \
            libxcb-cursor0 \
            libxcb-shape0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-xinerama0 \
            libxcb-xfixes0

      - name: Configure ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ${{ runner.os }}-ccache-${{ hashFiles('CMakeLists.txt', 'src/**', 'include/**', 'bindings/**') }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          # Pre-install lightweight CPU PyTorch wheel to prevent downloading ~2.5GB CUDA runtime
          pip install torch --extra-index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Prepare model assets
        run: |
          # Automatically downloads remote weights or synthesizes verified mock ONNX profiles
          python scripts/download_weights.py

      - name: Build C++ core engine (CMake & ccache)
        run: |
          # Add CUDA toolkit binaries to PATH if present on runner
          if [ -d "/usr/local/cuda/bin" ]; then
            export PATH="/usr/local/cuda/bin:$PATH"
            export LD_LIBRARY_PATH="/usr/local/cuda/lib64:${LD_LIBRARY_PATH:-}"
          fi
          ccache -z # Zero ccache stats before build
          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CUDA_RUNTIME_LIBRARY=Shared \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache
          cmake --build build -j$(nproc)
          ccache -s # Print ccache hit rate

      - name: Run C++ Unit Tests (CTest)
        run: |
          ctest --test-dir build --output-on-failure

      - name: Run Headless UI & Integration Tests (PyTest)
        run: |
          pytest -v tests/

      - name: Run End-to-End System Validation
        run: |
          python validate_system.py

      - name: Build Standalone Release Bundle
        run: |
          python build_release.py --clean
          # Create compressed archive for release asset distribution
          tar -czf dist/AerialWorkstation-Linux-x86_64.tar.gz -C dist AerialWorkstation

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: AerialWorkstation-Linux
          path: |
            dist/AerialWorkstation/
            dist/AerialWorkstation-Linux-x86_64.tar.gz
          retention-days: 14
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: test-and-build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: AerialWorkstation-Linux
          path: release_assets/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/**/AerialWorkstation-Linux-x86_64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}