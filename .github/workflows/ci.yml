name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install system dependencies & headless Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libgl1 libegl1 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 xvfb

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r .devcontainer/requirements.txt
          pip install pytest pyinstaller

      - name: Download release models
        run: |
          # Автоматичне підтягування ваг перед збіркою та тестами
          python scripts/download_weights.py

      - name: Build C++ core engine (CMake)
        run: |
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j$(nproc)

      - name: Run Unit & Integration Tests (Headless)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          ctest --test-dir build --output-on-failure
          pytest -v tests/
          python validate_system.py

      - name: Build Standalone Release Bundle
        run: |
          python build_release.py --clean

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AerialWorkstation-Linux
          path: dist/AerialWorkstation/

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/AerialWorkstation/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}