name: CI/CD Pipeline

on:
  push:
    branches: [ main, master, development ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master, development ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_QPA_PLATFORM: offscreen

jobs:
  test-and-build:
    name: Build & Package (${{ matrix.os_name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            os_name: Linux
            artifact_name: AerialWorkstation-Linux
            archive_name: AerialWorkstation-Linux-x86_64.tar.gz
          - os: windows-2022
            os_name: Windows
            artifact_name: AerialWorkstation-Windows
            archive_name: AerialWorkstation-Windows-x64.zip

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      # ================= LINUX DEPENDENCIES =================
      - name: "[Linux] Install system dependencies & headless Qt/XCB"
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ccache g++ xvfb \
            libgl1 libegl1 libgl1-mesa-dri libglib2.0-0 \
            libfontconfig1 libfreetype6 libdbus-1-3 \
            libxkbcommon-x11-0 libxkbcommon0 libx11-xcb1 \
            libxrender1 libxext6 libxcb-cursor0 libxcb-shape0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0

      - name: "[Linux] Configure ccache"
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ${{ runner.os }}-ccache-${{ hashFiles('CMakeLists.txt', 'src/**', 'include/**', 'bindings/**') }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      # ================= PYTHON & MODELS =================
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --extra-index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install pyinstaller pytest

      - name: Prepare model assets
        run: |
          python scripts/download_weights.py

      # ================= BUILD (LINUX) =================
      - name: "[Linux] Build C++ core engine (CMake)"
        if: runner.os == 'Linux'
        run: |
          ccache -z
          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CUDA_RUNTIME_LIBRARY=Shared \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache
          cmake --build build -j$(nproc)
          ccache -s

      # ================= BUILD (WINDOWS) =================
      - name: "[Windows] Build C++ core engine (MSVC)"
        if: runner.os == 'Windows'
        run: |
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --parallel

      # ================= TESTING =================
      - name: Run C++ Unit Tests (CTest)
        run: |
          ctest --test-dir build -C Release --output-on-failure

      - name: Run Headless UI & Integration Tests (PyTest)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          pytest -v tests/

      - name: Run End-to-End System Validation
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python validate_system.py

      # ================= PACKAGING =================
      - name: "[Linux] Build Standalone Release Bundle & Archive"
        if: runner.os == 'Linux'
        run: |
          python build_release.py --skip-cpp --clean
          tar -czf dist/${{ matrix.archive_name }} -C dist AerialWorkstation

      - name: "[Windows] Build Standalone Release Bundle & Archive"
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python build_release.py --skip-cpp --clean
          Compress-Archive -Path dist/AerialWorkstation -DestinationPath dist/${{ matrix.archive_name }} -Force

      # ================= UPLOAD ARTIFACTS =================
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            dist/AerialWorkstation/
            dist/${{ matrix.archive_name }}
          retention-days: 14
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: test-and-build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release_assets/**/*.tar.gz
            release_assets/**/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}